<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Average Calculator — Zunio</title>

    <meta name="description"
          content="Free average calculator. Find the average of multiple numbers quickly with Zunio.">

    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
    <div class="nav">

        <a href="../index.html" class="logo">
            Zu<span>nio</span>
        </a>

        <nav>
            <a href="../index.html#calculate">Calculate</a>
            <a href="../index.html#understand">Understand</a>
            <a href="../index.html#create">Create</a>
        </nav>

    </div>
</header>


<main>

    <div class="container">

        <section class="tool">

            <h1>Average Calculator</h1>

            <p>
                Enter numbers separated by commas to find their average.
            </p>


            <div class="form-group">

                <label for="numbers">
                    Numbers
                </label>

                <input
                    type="text"
                    id="numbers"
                    placeholder="e.g. 10, 20, 30, 40">

            </div>


            <button onclick="calculateAverage()">
                Calculate
            </button>


            <div
                id="result"
                class="result"
                style="display: none;">
            </div>

        </section>

    </div>

</main>


<footer>

    <p>
        © 2026 Zunio. Free everyday tools.
    </p>

    <p>

        <a href="../about.html">
            About
        </a>

        <a href="../contact.html">
            Contact
        </a>

        <a href="../privacy.html">
            Privacy
        </a>

        <a href="../terms.html">
            Terms
        </a>

    </p>

</footer>


<script>

function calculateAverage() {

    const input =
        document.getElementById("numbers").value.trim();

    const result =
        document.getElementById("result");


    if (!input) {

        result.style.display = "block";

        result.textContent =
            "Please enter some numbers.";

        return;
    }


    const numbers =
        input.split(",")
        .map(number => number.trim())
        .filter(number => number !== "")
        .map(number => Number(number));


    if (numbers.some(number => !Number.isFinite(number))) {

        result.style.display = "block";

        result.textContent =
            "Please enter valid numbers separated by commas.";

        return;
    }


    const sum =
        numbers.reduce(
            (total, number) => total + number,
            0
        );


    const average =
        sum / numbers.length;


    result.style.display = "block";

    result.textContent =
        "Average: " + average.toFixed(2);
}

</script>

</body>

</html>
