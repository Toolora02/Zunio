<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Discount Calculator — Zunio</title>

    <meta name="description"
          content="Free discount calculator. Calculate sale prices and savings quickly with Zunio.">

    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
    <div class="nav">

        <a href="../index.html" class="logo">
            Zu<span>nio</span>
        </a>

        <nav>
            <a href="../index.html#calculate">Calculate</a>
            <a href="../index.html#understand">Understand</a>
            <a href="../index.html#create">Create</a>
        </nav>

    </div>
</header>


<main>

    <div class="container">

        <section class="tool">

            <h1>Discount Calculator</h1>

            <p>
                Calculate the discount amount and final sale price.
            </p>


            <div class="form-group">

                <label for="price">
                    Original Price
                </label>

                <input
                    type="number"
                    id="price"
                    placeholder="e.g. 1000"
                    min="0">

            </div>


            <div class="form-group">

                <label for="discount">
                    Discount (%)
                </label>

                <input
                    type="number"
                    id="discount"
                    placeholder="e.g. 20"
                    min="0"
                    max="100">

            </div>


            <button onclick="calculateDiscount()">
                Calculate
            </button>


            <div
                id="result"
                class="result"
                style="display: none;">
            </div>

        </section>

    </div>

</main>


<footer>

    <p>
        © 2026 Zunio. Free everyday tools.
    </p>

    <p>

        <a href="../about.html">
            About
        </a>

        <a href="../contact.html">
            Contact
        </a>

        <a href="../privacy.html">
            Privacy
        </a>

        <a href="../terms.html">
            Terms
        </a>

    </p>

</footer>


<script>

function calculateDiscount() {

    const price =
        parseFloat(document.getElementById("price").value);

    const discount =
        parseFloat(document.getElementById("discount").value);

    const result =
        document.getElementById("result");


    if (isNaN(price) || isNaN(discount)) {

        result.style.display = "block";

        result.textContent =
            "Please enter both the original price and discount.";

        return;
    }


    if (price < 0) {

        result.style.display = "block";

        result.textContent =
            "Price cannot be negative.";

        return;
    }


    if (discount < 0 || discount > 100) {

        result.style.display = "block";

        result.textContent =
            "Discount must be between 0% and 100%.";

        return;
    }


    const saved =
        price * (discount / 100);

    const finalPrice =
        price - saved;


    result.style.display = "block";

    result.innerHTML =
        "You save: ₹" + saved.toFixed(2) +
        "<br>Final price: ₹" + finalPrice.toFixed(2);
}

</script>

</body>

</html>
