<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Age Calculator — Zunio</title>

    <meta name="description"
          content="Free age calculator. Calculate your exact age in years, months and days with Zunio.">

    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
    <div class="nav">

        <a href="../index.html" class="logo">
            Zu<span>nio</span>
        </a>

        <nav>
            <a href="../index.html#calculate">Calculate</a>
            <a href="../index.html#understand">Understand</a>
            <a href="../index.html#create">Create</a>
        </nav>

    </div>
</header>


<main>

    <div class="container">

        <section class="tool">

            <h1>Age Calculator</h1>

            <p>
                Calculate your exact age in years, months and days.
            </p>


            <div class="form-group">

                <label for="birthDate">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="birthDate">

            </div>


            <button onclick="calculateAge()">
                Calculate Age
            </button>


            <div
                id="result"
                class="result"
                style="display: none;">
            </div>

        </section>

    </div>

</main>


<footer>

    <p>
        © 2026 Zunio. Free everyday tools.
    </p>

    <p>

        <a href="../about.html">
            About
        </a>

        <a href="../contact.html">
            Contact
        </a>

        <a href="../privacy.html">
            Privacy
        </a>

        <a href="../terms.html">
            Terms
        </a>

    </p>

</footer>


<script>

function calculateAge() {

    const birthDate =
        new Date(document.getElementById("birthDate").value);

    const result =
        document.getElementById("result");

    const today =
        new Date();


    if (!document.getElementById("birthDate").value) {

        result.style.display = "block";

        result.textContent =
            "Please enter your date of birth.";

        return;
    }


    if (birthDate > today) {

        result.style.display = "block";

        result.textContent =
            "Date of birth cannot be in the future.";

        return;
    }


    let years =
        today.getFullYear() - birthDate.getFullYear();

    let months =
        today.getMonth() - birthDate.getMonth();

    let days =
        today.getDate() - birthDate.getDate();


    if (days < 0) {

        months--;

        const previousMonth =
            new Date(
                today.getFullYear(),
                today.getMonth(),
                0
            );

        days += previousMonth.getDate();
    }


    if (months < 0) {

        years--;

        months += 12;
    }


    result.style.display = "block";

    result.textContent =
        "Your age is " +
        years + " years, " +
        months + " months, and " +
        days + " days.";
}

</script>

</body>

</html>
